name: 버그 제보
description: 앱이 설명과 다르게 동작하거나 멈추는 문제를 알려 주세요.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        혼자 관리하는 프로젝트라 모든 제보에 답하지 못할 수 있습니다. 재현 절차가 분명한 제보부터 확인합니다.
  - type: input
    id: version
    attributes:
      label: 앱 버전
      description: 설치 파일 이름이나 앱 정보 창의 버전 (예 0.1.0)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 운영체제
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: 셸
      description: 문제가 난 터미널의 셸 (zsh, bash, PowerShell, 명령 프롬프트, Git Bash, WSL 등)
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 앱을 켠 뒤 무엇을 누르고 입력했는지 순서대로 적어 주세요.
      placeholder: |
        1. 앱을 켠다
        2. 사이드바에서 New work terminal을 누른다
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 화면·로그
      description: 스크린샷이나 오류 메시지가 있으면 붙여 주세요.
