# Paddock 설치 파일 설정. scripts/package.cjs가 운영체제별로 호출한다.
# 설치 파일은 그 운영체제에서 만든다. 터미널용 네이티브 모듈이 운영체제별로 컴파일되기 때문이다.
appId: io.github.youngjaechoung.paddock
productName: Paddock
# 버전을 파일 이름에 넣지 않는다. README의 최신 릴리스 다운로드 주소가 이 이름에 고정돼 있다.
artifactName: Paddock-${os}-${arch}.${ext}
electronDist: node_modules/electron/dist
# Theia는 앱 폴더의 파일을 실제 경로로 읽으므로 asar로 묶지 않는다.
asar: false
# 네이티브 모듈은 setup 단계의 theia rebuild:electron이 이미 Electron용으로 컴파일했다.
npmRebuild: false
nodeGypRebuild: false
directories:
  output: dist
files:
  - lib
  - src-gen
  - paddock-shell
  # VS Code 내장 확장(Source control용 git, 언어별 코드 색, 이미지·오디오·영상 미리보기). 설치 파일에 넣어 두므로 사용자는 설치할 때 따로 받지 않는다.
  # 만드는 쪽은 setup 단계의 download:plugins가 받고, 빠졌으면 scripts/package.cjs가 제작 전에 받거나 멈춘다.
  - plugins
  # 색 테마 전용 확장(기본 Paddock Dark·Light, Mermaid Dark·Light). 저장소에 있다.
  - themes
  - package.json
  # node_modules는 설치본에 넣지 않는다. 배포 번들(lib)이 백엔드·화면 코드를 모두 묶고, 네이티브 모듈(터미널·파일 감시·검색)도
  # lib/backend/native와 lib/prebuilds로 복사해 두어 실행 중에 node_modules를 읽지 않는다. 바깥에 남긴 electron은 실행 파일이 제공한다.
  # 넣으면 파일이 2만 개 늘어 Windows 설치·압축 해제가 몇 분씩 걸린다(새 파일마다 백신 검사).
  # 같은 이유로 Windows npm이 로컬 패키지(@paddock/shell)를 폴더 연결로 설치하면서 저장소 루트를 paddock 패키지로 한 번 더 넣던 문제도 함께 사라진다.
  - "!**/node_modules/**"
  # 소스 지도(.map)는 오류 위치를 원본 코드로 되짚는 개발용 파일이라 실행에 쓰지 않는다.
  - "!lib/**/*.map"

mac:
  target: dmg
  # 원본은 resources/icon-mac.svg. 824px 타일을 1024px 캔버스 가운데 둔 macOS 아이콘 격자를 따른다.
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  # 개발자 인증서 없이 자체 서명한다. Apple Silicon은 서명이 없으면 실행을 거부한다.
  identity: "-"
  hardenedRuntime: false

win:
  target: nsis
  # 원본은 resources/icon-win.svg. Windows는 여백 없이 캔버스를 채운다. 설치 마법사 아이콘도 이 파일을 쓴다.
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
