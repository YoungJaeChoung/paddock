# Paddock 설치 파일 설정. scripts/package.cjs가 운영체제별로 호출한다.
# 설치 파일은 그 운영체제에서 만든다. 터미널용 네이티브 모듈이 운영체제별로 컴파일되기 때문이다.
appId: io.github.youngjaechoung.paddock
productName: Paddock
# 버전을 파일 이름에 넣지 않는다. README의 최신 릴리스 다운로드 주소가 이 이름에 고정돼 있다.
artifactName: Paddock-${os}-${arch}.${ext}
electronDist: node_modules/electron/dist
# Theia는 앱 폴더의 파일을 실제 경로로 읽으므로 asar로 묶지 않는다.
asar: false
# 네이티브 모듈은 setup 단계의 theia rebuild:electron이 이미 Electron용으로 컴파일했다.
npmRebuild: false
nodeGypRebuild: false
directories:
  output: dist
files:
  - lib
  - src-gen
  - paddock-shell
  # Source control 보기에 쓰는 VS Code 내장 git 확장. setup 단계의 download:plugins가 받는다.
  - plugins
  # 기본 색 테마(Mermaid Dark·Light)를 담은 테마 전용 확장. 저장소에 있다.
  - themes
  - package.json
  - "!**/node_modules/electron/**"
  # Windows npm은 로컬 패키지(@paddock/shell)를 폴더 연결로 설치하는데, 의존성 수집기가 이를 따라가 저장소 루트를
  # paddock 패키지로 한 번 더 넣는다. paddock-shell은 배포 번들(lib)에 이미 포함돼 있어 빼도 된다.
  - "!**/node_modules/paddock/**"

mac:
  target: dmg
  # 원본은 resources/icon-mac.svg. 824px 타일을 1024px 캔버스 가운데 둔 macOS 아이콘 격자를 따른다.
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  # 개발자 인증서 없이 자체 서명한다. Apple Silicon은 서명이 없으면 실행을 거부한다.
  identity: "-"
  hardenedRuntime: false

win:
  target: nsis
  # 원본은 resources/icon-win.svg. Windows는 여백 없이 캔버스를 채운다. 설치 마법사 아이콘도 이 파일을 쓴다.
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
