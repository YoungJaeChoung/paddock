# 의존 크레이트 검사 설정(cargo-deny). 라이선스 검사가 핵심이다: GPL·AGPL·LGPL 계열이 하나라도 있으면 실패한다.
# 실행: cargo deny check licenses (Windows·Linux 모두 같은 의존 그래프를 보도록 두 대상을 함께 검사한다)

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[licenses]
# 허용 목록에 있는 라이선스만 통과한다. 목록에 없는 것(GPL 계열 포함)은 모두 거부된다.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
# Zed 편집기 본체의 크레이트(GPL 계열)는 들이지 않는다. GPUI 크레이트(gpui-*)만 쓴다.
multiple-versions = "allow"
deny = [
    { crate = "terminal" },
    { crate = "terminal_view" },
    { crate = "editor" },
    { crate = "workspace" },
]
