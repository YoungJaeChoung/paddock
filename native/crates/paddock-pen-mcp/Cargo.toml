[package]
name = "paddock-pen-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server that opens, saves and closes .pen files in the Pen desktop app."

[[bin]]
name = "paddock-pen-mcp"
path = "src/main.rs"

[dependencies]
paddock-core.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# 저장 메뉴를 접근성 기능(MSAA)으로 누르는 데만 쓴다. IAccessible은 COM 인터페이스라 windows-sys로는 메서드를 부를 수 없다.
windows = { workspace = true, features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[dev-dependencies]
tempfile.workspace = true
